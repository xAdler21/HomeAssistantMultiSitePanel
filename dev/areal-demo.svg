<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000">
  <!-- Erfundenes Areal als Luftbild-Skizze, nur für die lokale Vorschau -->
  <defs>
    <pattern id="gras" width="40" height="40" patternUnits="userSpaceOnUse">
      <rect width="40" height="40" fill="#7d9a57"/>
      <circle cx="8" cy="10" r="1.4" fill="#6f8c4b"/><circle cx="28" cy="26" r="1.6" fill="#89a663"/><circle cx="18" cy="34" r="1.2" fill="#6f8c4b"/>
    </pattern>
    <pattern id="kies" width="24" height="24" patternUnits="userSpaceOnUse">
      <rect width="24" height="24" fill="#c9c1ad"/>
      <circle cx="5" cy="6" r="1.2" fill="#b8af99"/><circle cx="16" cy="15" r="1.3" fill="#d6cfbd"/><circle cx="10" cy="20" r="1" fill="#b8af99"/>
    </pattern>
    <pattern id="ziegel" width="16" height="12" patternUnits="userSpaceOnUse">
      <rect width="16" height="12" fill="#9b4d3b"/><path d="M0 11.5H16" stroke="#86402f" stroke-width="1"/>
    </pattern>
    <pattern id="blech" width="14" height="14" patternUnits="userSpaceOnUse">
      <rect width="14" height="14" fill="#9ea7ab"/><path d="M7 0V14" stroke="#8b9498" stroke-width="2"/>
    </pattern>
    <pattern id="holz" width="12" height="12" patternUnits="userSpaceOnUse">
      <rect width="12" height="12" fill="#7a5c3e"/><path d="M0 6H12" stroke="#6a4f35" stroke-width="1.5"/>
    </pattern>
    <filter id="schatten" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="14" dy="16" stdDeviation="6" flood-color="#000" flood-opacity=".35"/>
    </filter>
  </defs>

  <rect width="1600" height="1000" fill="url(#gras)"/>
  <!-- Straße -->
  <rect x="0" y="900" width="1600" height="100" fill="#5b5f62"/>
  <path d="M0 950H1600" stroke="#e8e4d8" stroke-width="5" stroke-dasharray="40 30"/>
  <!-- Einfahrt und Hof -->
  <path d="M700 900 L760 760 L640 470 L1150 470 L1240 560 L1120 760 L860 760 L900 900 Z" fill="url(#kies)"/>
  <!-- Garten am Wohnhaus -->
  <rect x="1150" y="830" width="420" height="60" rx="8" fill="#6a8a46"/>
  <rect x="1460" y="560" width="110" height="260" rx="8" fill="#94b06a"/>

  <!-- Werkstatt -->
  <g filter="url(#schatten)">
    <rect x="180" y="180" width="420" height="260" fill="url(#ziegel)"/>
    <path d="M180 310H600" stroke="#6f3022" stroke-width="5"/>
  </g>
  <!-- Neue Halle -->
  <g filter="url(#schatten)">
    <rect x="700" y="140" width="520" height="300" fill="url(#blech)"/>
    <rect x="700" y="140" width="520" height="300" fill="none" stroke="#7d8689" stroke-width="4"/>
    <rect x="820" y="200" width="70" height="50" fill="#c9e3f0" opacity=".7"/><rect x="1030" y="200" width="70" height="50" fill="#c9e3f0" opacity=".7"/>
  </g>
  <!-- Stadel -->
  <g filter="url(#schatten)">
    <rect x="1300" y="180" width="220" height="340" fill="url(#holz)"/>
    <path d="M1410 180V520" stroke="#5c432c" stroke-width="5"/>
  </g>
  <!-- Büro -->
  <g filter="url(#schatten)">
    <rect x="180" y="520" width="360" height="200" fill="#7b665a"/>
    <path d="M180 620H540" stroke="#5e4c42" stroke-width="5"/>
    <rect x="460" y="720" width="80" height="60" fill="#8a7568"/>
  </g>
  <!-- Wohnhaus -->
  <g filter="url(#schatten)">
    <rect x="1180" y="600" width="260" height="200" fill="url(#ziegel)"/>
    <path d="M1180 700H1440" stroke="#6f3022" stroke-width="5"/>
    <rect x="1230" y="630" width="44" height="30" fill="#2f3b44"/><rect x="1340" y="630" width="44" height="30" fill="#2f3b44"/>
  </g>
  <!-- PV auf der Werkstatt -->
  <g opacity=".95">
    <rect x="200" y="196" width="380" height="96" fill="#1f3550"/>
    <path d="M200 228H580M200 260H580M247 196V292M294 196V292M341 196V292M388 196V292M435 196V292M482 196V292M529 196V292" stroke="#5a7a9e" stroke-width="1.5"/>
  </g>

  <!-- Bäume -->
  <g filter="url(#schatten)">
    <circle cx="90" cy="120" r="55" fill="#3f6b2f"/><circle cx="110" cy="840" r="62" fill="#3a6229"/>
    <circle cx="640" cy="80" r="40" fill="#46773a"/><circle cx="1580" cy="80" r="70" fill="#3f6b2f"/>
    <circle cx="1560" cy="470" r="45" fill="#46773a"/><circle cx="600" cy="840" r="38" fill="#3a6229"/>
  </g>

  <!-- Beschriftungen -->
  <g font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="30" font-weight="700" fill="#fff" stroke="#1d241f" stroke-width="6" paint-order="stroke" text-anchor="middle">
    <text x="390" y="420">Werkstatt</text>
    <text x="960" y="420">Neue Halle</text>
    <text x="1410" y="500">Stadel</text>
    <text x="360" y="700">Büro</text>
    <text x="1310" y="780">Wohnhaus</text>
    <text x="900" y="640">Hof</text>
  </g>
</svg>
