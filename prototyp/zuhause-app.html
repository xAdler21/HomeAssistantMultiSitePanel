<style>
/* Layout: one iPhone-width app column with a pinned tab bar; full-bleed on phones, inside a device frame on wide screens. */
:root{
  --page:#D9DFD9; --bg:#F1F3F0; --card:#FFFFFF; --sheet:#F6F7F5; --bar:rgba(246,247,245,.84);
  --fill:#E5E8E3; --fill-2:#D6DBD4;
  --fg:#111512; --fg-2:#565E58; --fg-3:#858D87; --sep:rgba(17,21,18,.10);
  --accent:#1C6A54; --accent-fg:#FFFFFF; --accent-tint:#DAECE4;
  --tile-on:#FFFFFF; --tile-on-fg:#111512; --tile-on-sub:#565E58;
  --tile-off:#E2E6E0; --tile-off-fg:#2F3631; --tile-off-sub:#78807A;
  --ink-on-color:#FFFFFF; --knob:#FFFFFF; --island:#050605;
  --c-light:#EDA000; --c-heat:#E4572E; --c-tv:#5856D6; --c-appl:#178A99; --c-power:#D99A00;
  --c-gas:#2F6FDB; --c-water:#1590B0; --c-well:#0E8478; --c-wood:#9C5B24; --c-oil:#6B5741;
  --c-net:#6153D0; --c-sun:#EB6834;
  --ok:#1A7F45; --ok-bg:#DCF0E3; --warn:#8F5300; --warn-bg:#FBE7C2; --crit:#B9332E; --crit-bg:#F9DCD9; --muted-bg:#E5E8E3;
  --s1:#2a78d6; --s2:#eb6834; --grid:#E3E6E1; --axis:#C3C8C1;
  --cam-sky:#8EA2B2; --cam-far:#B9C3BF; --cam-ground:#5C6956; --cam-deep:#2D352F; --cam-ink:#FFFFFF; --cam-live:#E5483F;
  --frame:#1A1D1B;
  --shadow:0 1px 2px rgba(17,21,18,.05),0 3px 12px rgba(17,21,18,.06);
  --shadow-strong:0 6px 24px rgba(17,21,18,.16);
  --font-ui:-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;
  --font-num:ui-rounded,"SF Pro Rounded",-apple-system,BlinkMacSystemFont,system-ui,"Segoe UI",sans-serif;
  --r-tile:18px; --r-card:16px; --tabbar-h:58px;
  --top-inset:env(safe-area-inset-top,0px); --bottom-inset:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --page:#040504; --bg:#0D0F0E; --card:#1A1D1B; --sheet:#171A18; --bar:rgba(20,23,21,.84);
    --fill:#252926; --fill-2:#323732;
    --fg:#F1F3F0; --fg-2:#A9B1AB; --fg-3:#737B75; --sep:rgba(241,243,240,.10);
    --accent:#5BC3A0; --accent-fg:#06190F; --accent-tint:#163228;
    --tile-on:#ECEFEA; --tile-on-fg:#111512; --tile-on-sub:#545C56;
    --tile-off:#1E2220; --tile-off-fg:#DCE1DC; --tile-off-sub:#8A928C;
    --c-light:#FFB61C; --c-heat:#FF7A4D; --c-tv:#8B88F0; --c-appl:#36B3C3; --c-power:#F0B321;
    --c-gas:#6C9AF0; --c-water:#3BB5D5; --c-well:#33B1A3; --c-wood:#CF8A4B; --c-oil:#B49B7D;
    --c-net:#988DF0; --c-sun:#F07A45;
    --ok:#52CF85; --ok-bg:#15331F; --warn:#F3B640; --warn-bg:#3A2909; --crit:#FF6E66; --crit-bg:#3C1614; --muted-bg:#252926;
    --s1:#3987e5; --s2:#d95926; --grid:#262A27; --axis:#3B403C;
    --frame:#2A2E2B; --shadow:none; --shadow-strong:0 8px 28px rgba(0,0,0,.5);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --page:#040504; --bg:#0D0F0E; --card:#1A1D1B; --sheet:#171A18; --bar:rgba(20,23,21,.84);
  --fill:#252926; --fill-2:#323732;
  --fg:#F1F3F0; --fg-2:#A9B1AB; --fg-3:#737B75; --sep:rgba(241,243,240,.10);
  --accent:#5BC3A0; --accent-fg:#06190F; --accent-tint:#163228;
  --tile-on:#ECEFEA; --tile-on-fg:#111512; --tile-on-sub:#545C56;
  --tile-off:#1E2220; --tile-off-fg:#DCE1DC; --tile-off-sub:#8A928C;
  --c-light:#FFB61C; --c-heat:#FF7A4D; --c-tv:#8B88F0; --c-appl:#36B3C3; --c-power:#F0B321;
  --c-gas:#6C9AF0; --c-water:#3BB5D5; --c-well:#33B1A3; --c-wood:#CF8A4B; --c-oil:#B49B7D;
  --c-net:#988DF0; --c-sun:#F07A45;
  --ok:#52CF85; --ok-bg:#15331F; --warn:#F3B640; --warn-bg:#3A2909; --crit:#FF6E66; --crit-bg:#3C1614; --muted-bg:#252926;
  --s1:#3987e5; --s2:#d95926; --grid:#262A27; --axis:#3B403C;
  --frame:#2A2E2B; --shadow:none; --shadow-strong:0 8px 28px rgba(0,0,0,.5);
  color-scheme:dark;
}

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--page);color:var(--fg);font-family:var(--font-ui);font-size:15px;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer;text-align:left;-webkit-touch-callout:none}
button:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3,h4,p{margin:0}
.ms{font-family:'Material Symbols Rounded';font-weight:normal;font-style:normal;font-size:24px;line-height:1;letter-spacing:normal;text-transform:none;display:inline-block;white-space:nowrap;direction:ltr;font-feature-settings:'liga';-webkit-font-feature-settings:'liga';font-variation-settings:'FILL' 0;user-select:none;flex:none}
.ms.f{font-variation-settings:'FILL' 1}

/* Stage & device */
.stage{height:100%;display:flex;align-items:center;justify-content:center;padding-inline:16px}
.device{position:fixed;inset:0;background:var(--bg);overflow:hidden;isolation:isolate}
@media (min-width:640px) and (min-height:720px){
  .stage{padding-block:24px}
  .device{position:relative;inset:auto;width:390px;height:min(844px,100%);border-radius:48px;
    box-shadow:0 0 0 11px var(--frame),0 0 0 12px var(--sep),0 40px 90px -24px rgba(0,0,0,.45);
    --top-inset:54px;--bottom-inset:20px}
  .device::before{content:"";position:absolute;top:11px;left:50%;transform:translateX(-50%);width:120px;height:34px;border-radius:20px;background:var(--island);z-index:60}
  .device::after{content:"";position:absolute;bottom:8px;left:50%;transform:translateX(-50%);width:134px;height:5px;border-radius:3px;background:var(--fg);opacity:.8;z-index:60}
}
.screen{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;overscroll-behavior-y:contain;padding-bottom:calc(var(--tabbar-h) + var(--bottom-inset) + 28px);scrollbar-width:none}
.screen::-webkit-scrollbar{display:none}
.topscrim{position:absolute;top:0;left:0;right:0;height:var(--top-inset);background:var(--bar);-webkit-backdrop-filter:saturate(1.8) blur(18px);backdrop-filter:saturate(1.8) blur(18px);z-index:15;pointer-events:none;opacity:0;transition:opacity .2s}
.device.root.scrolled .topscrim{opacity:1}

/* Tab bar */
.tabbar{position:absolute;left:0;right:0;bottom:0;z-index:20;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));height:calc(var(--tabbar-h) + var(--bottom-inset));padding:6px 4px var(--bottom-inset);background:var(--bar);-webkit-backdrop-filter:saturate(1.8) blur(20px);backdrop-filter:saturate(1.8) blur(20px);border-top:.5px solid var(--sep)}
.tab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--fg-3);font-size:10.5px;font-weight:600;letter-spacing:.01em;border-radius:12px}
.tab .ms{font-size:26px}
.tab.active{color:var(--accent)}
.tab.active .ms{font-variation-settings:'FILL' 1}

/* Headers */
.lt{display:flex;flex-direction:column;gap:6px;padding-top:calc(var(--top-inset) + 14px)}
.lt.pushed{padding-top:2px}
.lt-row{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:34px}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--fg-2)}
h1{font-size:32px;line-height:1.1;font-weight:700;letter-spacing:-.02em;text-wrap:balance}
.draft{align-self:flex-start;font-size:12px;font-weight:600;color:var(--fg-2);background:var(--fill);padding:4px 9px;border-radius:999px}
.site-btn{display:inline-flex;align-items:center;gap:3px;padding:6px 8px 6px 7px;border-radius:999px;background:var(--card);box-shadow:var(--shadow);font-size:14px;font-weight:600;max-width:60%;min-width:0}
.site-btn span:not(.ms){overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.site-btn .ms{font-size:18px;color:var(--accent)}
.site-btn .ms:last-child{color:var(--fg-3)}
.nav{position:sticky;top:0;z-index:10;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:calc(var(--top-inset) + 4px) 8px 6px;transition:background .2s}
.device.scrolled .nav{background:var(--bar);-webkit-backdrop-filter:saturate(1.8) blur(18px);backdrop-filter:saturate(1.8) blur(18px);box-shadow:0 .5px 0 var(--sep)}
.back{display:inline-flex;align-items:center;gap:1px;color:var(--accent);font-size:16px;padding:6px 6px 6px 2px;justify-self:start;max-width:100%;min-width:0}
.back span:not(.ms){overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.back .ms{font-size:20px}
.nav-title{font-size:16px;font-weight:600;opacity:0;transition:opacity .2s;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:190px}
.device.scrolled .nav-title{opacity:1}

/* View & sections */
.view{padding-inline:16px;display:flex;flex-direction:column;gap:28px}
.anim-push{animation:pushIn .32s cubic-bezier(.2,.8,.2,1)}
.anim-pop{animation:popIn .28s cubic-bezier(.2,.8,.2,1)}
.anim-tab{animation:fadeIn .18s ease-out}
@keyframes pushIn{from{transform:translateX(36px);opacity:.35}to{transform:none;opacity:1}}
@keyframes popIn{from{transform:translateX(-24px);opacity:.5}to{transform:none;opacity:1}}
@keyframes fadeIn{from{opacity:.4}to{opacity:1}}
.sec{display:flex;flex-direction:column;gap:10px}
.sec-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
h2{font-size:20px;font-weight:700;letter-spacing:-.01em}
.link{color:var(--accent);font-size:15px;font-weight:500;white-space:nowrap}
.hint{font-size:13px;color:var(--fg-3);line-height:1.35}
.card{background:var(--card);border-radius:var(--r-card);box-shadow:var(--shadow)}
.empty{padding:18px 16px;font-size:14px;color:var(--fg-2);line-height:1.4}

/* Status chips */
.chips{display:flex;gap:8px;overflow-x:auto;margin-inline:-16px;padding:2px 16px 6px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;display:flex;align-items:center;gap:9px;padding:8px 14px 8px 8px;border-radius:14px;background:var(--card);box-shadow:var(--shadow)}
.chip-ic{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--c);color:var(--ink-on-color)}
.chip-ic .ms{font-size:18px}
.chip-txt{display:flex;flex-direction:column;line-height:1.2}
.chip-l{font-size:12px;color:var(--fg-2)}
.chip-v{font-size:14px;font-weight:600;white-space:nowrap}

/* Alerts */
.alerts{display:flex;flex-direction:column;gap:8px}
.alert{display:flex;align-items:center;gap:12px;padding:12px 12px 12px 14px;border-radius:var(--r-card);background:var(--card);box-shadow:var(--shadow)}
.alert-ic{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;flex:none}
.alert.warn .alert-ic{background:var(--warn-bg);color:var(--warn)}
.alert.ok .alert-ic{background:var(--ok-bg);color:var(--ok)}
.alert-ic .ms{font-size:20px}
.alert-txt{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.alert-txt strong{font-size:15px;font-weight:600}
.alert-txt span{font-size:13px;color:var(--fg-2)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:9px 16px;border-radius:999px;background:var(--accent);color:var(--accent-fg);font-size:15px;font-weight:600;white-space:nowrap;transition:transform .12s}
.btn:active{transform:scale(.96)}
.btn.sm{padding:7px 13px;font-size:14px}
.btn.ghost{background:var(--fill);color:var(--fg)}
.btn.wide{width:100%;padding:14px}
.btn[disabled]{opacity:.4;pointer-events:none}

/* Scenes */
.scenes{display:flex;gap:10px;overflow-x:auto;margin-inline:-16px;padding:2px 16px 6px;scrollbar-width:none}
.scenes::-webkit-scrollbar{display:none}
.scene{flex:none;width:152px;display:flex;flex-direction:column;gap:10px;padding:12px;border-radius:var(--r-tile);background:var(--card);box-shadow:var(--shadow);transition:transform .12s}
.scene:active{transform:scale(.97)}
.scene .ms{font-size:22px;color:var(--accent)}
.scene strong{font-size:15px;font-weight:600}
.scene span:not(.ms){font-size:12.5px;color:var(--fg-2);line-height:1.3}

/* Tiles */
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.tile{display:flex;flex-direction:column;justify-content:space-between;gap:12px;min-height:106px;padding:12px;border-radius:var(--r-tile);background:var(--tile-off);color:var(--tile-off-fg);transition:background .2s,transform .12s,box-shadow .2s;user-select:none;-webkit-user-select:none;touch-action:manipulation;min-width:0}
.tile:active{transform:scale(.965)}
.tile.on{background:var(--tile-on);color:var(--tile-on-fg);box-shadow:var(--shadow)}
.tile-ic{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--fill-2);color:var(--tile-off-sub);transition:background .2s,color .2s}
.tile.on .tile-ic{background:var(--c);color:var(--ink-on-color)}
.tile-ic .ms{font-size:21px}
.tile-txt{display:flex;flex-direction:column;gap:1px;min-width:0}
.tile-ctx{font-size:12px;color:var(--tile-off-sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile-name{font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile-sub{font-size:13px;color:var(--tile-off-sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile.on .tile-ctx,.tile.on .tile-sub{color:var(--tile-on-sub)}

/* Running devices */
.runs{display:flex;flex-direction:column;gap:8px}
.run{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:var(--r-card);background:var(--card);box-shadow:var(--shadow);width:100%}
.run-ic{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:var(--c);color:var(--ink-on-color);flex:none}
.run-ic .ms{font-size:22px}
.run-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.run-top{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.run-top strong{font-size:15px;font-weight:600}
.run-top span{font-size:14px;font-weight:600;color:var(--fg-2);font-variant-numeric:tabular-nums;white-space:nowrap}
.run-sub{font-size:13px;color:var(--fg-2)}
.prog{height:6px;border-radius:3px;background:var(--fill);overflow:hidden}
.prog span{display:block;height:100%;border-radius:3px;background:var(--c-appl)}

/* Energy flow card */
.flow{display:flex;flex-direction:column;gap:12px;padding:14px;width:100%}
.flow-top{display:flex;justify-content:space-between;align-items:center}
.flow-t{font-size:13px;font-weight:600;color:var(--fg-2)}
.chev{color:var(--fg-3);font-size:20px}
.flow-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.node{display:flex;flex-direction:column;align-items:flex-start;gap:4px;min-width:0}
.node-ic{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--c);color:var(--ink-on-color)}
.node-ic .ms{font-size:18px}
.node-v{font-family:var(--font-num);font-size:22px;font-weight:700;letter-spacing:-.01em}
.node-v small{font-size:13px;font-weight:600;color:var(--fg-2)}
.node-l{font-size:12.5px;color:var(--fg-2)}
.flow-say{font-size:14px;line-height:1.4;color:var(--fg);padding-top:10px;border-top:.5px solid var(--sep)}
.ecard{display:flex;align-items:center;gap:12px;padding:14px;width:100%;font-size:14px;line-height:1.4;color:var(--fg-2)}
.ecard .ms{color:var(--fg-3)}

/* Site cards */
.sites{display:flex;flex-direction:column;gap:10px}
.scard{display:flex;align-items:center;gap:14px;padding:14px;border-radius:var(--r-card);background:var(--card);box-shadow:var(--shadow);width:100%}
.scard-ic{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;background:var(--accent-tint);color:var(--accent);flex:none}
.scard-ic .ms{font-size:26px}
.scard-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.scard-name{font-size:16px;font-weight:600}
.scard-role{font-size:13px;color:var(--fg-2)}
.scard-meta{font-size:13px;color:var(--fg)}
.sup-icons{display:flex;gap:4px;margin-top:4px;flex-wrap:wrap}
.sup-dot{width:22px;height:22px;border-radius:7px;display:grid;place-items:center;background:var(--c);color:var(--ink-on-color)}
.sup-dot .ms{font-size:14px}

/* Room tiles */
.rtile{display:flex;flex-direction:column;gap:10px;padding:12px;border-radius:var(--r-tile);background:var(--card);box-shadow:var(--shadow);min-width:0;transition:transform .12s}
.rtile:active{transform:scale(.97)}
.rtile-ic{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:var(--fill);color:var(--fg-2)}
.rtile.lit .rtile-ic{background:var(--c-light);color:var(--ink-on-color)}
.rtile-ic .ms{font-size:20px}
.rtile-name{font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rtile-meta{font-size:13px;color:var(--fg-2);font-variant-numeric:tabular-nums}
.tiles .wide-span{grid-column:1 / -1}

/* Lists */
.list{background:var(--card);border-radius:var(--r-card);overflow:hidden;box-shadow:var(--shadow)}
.row{display:flex;align-items:center;gap:12px;width:100%;padding:11px 14px;min-height:56px;position:relative}
.row+.row::before{content:"";position:absolute;top:0;left:60px;right:0;border-top:.5px solid var(--sep)}
.row-ic{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:var(--c);color:var(--ink-on-color);flex:none}
.row-ic .ms{font-size:20px}
.row-ic.lg{width:44px;height:44px;border-radius:13px}
.row-ic.lg .ms{font-size:26px}
.row-ic.soft{background:var(--fill);color:var(--fg-2)}
.row-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.row-title{font-size:16px;font-weight:600}
.row-sub{font-size:13px;color:var(--fg-2);line-height:1.35}
.row-end{display:flex;flex-direction:column;align-items:flex-end;gap:4px;text-align:right;flex:none}
.row-val{font-size:15px;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.row-val.dim{color:var(--fg-3);font-weight:500}
.kv{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 14px;min-height:46px;position:relative;font-size:15px}
.kv+.kv::before{content:"";position:absolute;top:0;left:14px;right:0;border-top:.5px solid var(--sep)}
.kv span:first-child{color:var(--fg-2);display:flex;align-items:center;gap:8px}
.kv span:first-child .ms{font-size:18px;color:var(--fg-3)}
.kv b{font-weight:600;font-variant-numeric:tabular-nums;text-align:right}
.kv b.dim{color:var(--fg-3);font-weight:500}

/* Pills */
.pills{display:flex;gap:6px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;padding:3px 9px 3px 7px;border-radius:999px;white-space:nowrap}
.pill .ms{font-size:14px}
.pill.ok{background:var(--ok-bg);color:var(--ok)}

/* ---------- Strom Zähler 1: Tagesverlauf (Beispielwerte, Stand 15:30) ---------- */
const NOW_H = 15.5, STEP = 0.25;
const T = []; for (let i = 0; i * STEP <= NOW_H + 1e-9; i++) T.push(i * STEP);
const pvAt = t => { const x = (t - 7.4) / 11.2; if (x <= 0 || x >= 1) return 0; let v = 6.5 * Math.pow(Math.sin(Math.PI * x), 1.6); if (t > 10.5 && t < 11.25) v *= 0.55; return v; };
const loadAt = t => { let v = 0.55 + 0.08 * Math.sin(t * 1.7); if (t >= 6.5 && t < 17) v += 2.1 + 0.6 * Math.sin(t * 2.3); if (t >= 9 && t < 9.5) v += 1.8; if (t >= 14 && t < 14.5) v += 1.2; if (t >= 12 && t < 12.75) v -= 1.2; return Math.max(0.3, v); };
const PV = T.map(pvAt), LOAD = T.map(loadAt);
const NOW = {pv: PV[PV.length - 1], load: LOAD[LOAD.length - 1]};
NOW.grid = NOW.load - NOW.pv;
const integ = a => a.reduce((s, v) => s + v, 0) * STEP;
const TODAY = {
  pv: integ(PV), load: integ(LOAD),
  self: integ(PV.map((p, i) => Math.min(p, LOAD[i]))),
  feed: integ(PV.map((p, i) => Math.max(p - LOAD[i], 0))),
};

  const r = Object.values(ROOMS).filter(r => r.site === siteId && !r.outdoor);

function tile(d, opts = {}){

function flowCard(){

  chips.push(`<button class="chip" data-act="lights-sheet"><span class="chip-ic" style="--c:var(--c-light)">${ic('lightbulb', 'f')}</span><span class="chip-txt"><span class="chip-l">Licht</span><span class="chip-v">${lightsOn.length ? lightsOn.length + ' an' : 'Alle aus'}</span></span></button>`);

  if (siteMatch('m1')) chips.push(`<button class="chip" data-act="push" data-page="supply" data-id="strom1"><span class="chip-ic" style="--c:var(--c-sun)">${ic('solar_power', 'f')}</span><span class="chip-txt"><span class="chip-l">Solar</span><span class="chip-v">${f1(NOW.pv)} kW</span></span></button>`);
  chips.push(`<button class="chip" data-act="tab" data-tab="heizung"><span class="chip-ic" style="--c:var(--c-heat)">${ic('thermostat', 'f')}</span><span class="chip-txt"><span class="chip-l">Heizung</span><span class="chip-v">${heating.length ? heating.length + ' Räume heizen' : 'Alles warm'}</span></span></button>`);

  const alerts = [];

  const scenes = [
    {id:'feierabend', name:'Feierabend', sub:'Firma: Licht aus, Tore zu, Türen ab', site:'m1', icon:'lock'},
    {id:'nacht', name:'Gute Nacht', sub:'1a: Licht und TV aus, Haustür ab', site:'m1a', icon:'bedtime'},

    nav: navBar(s.short),
    body: pushedHeader(s.name, s.role) + pills +
      (on.length ? `<button class="btn ghost wide" data-act="site-lights-off" data-id="${id}">${ic('power_settings_new')}Alle Lichter hier aus</button>` : '') +
      groups + sec('Versorgt durch', `<div class="list">${sups.map(supplyRow).join('')}</div>`),
  };
};

PAGES.room = id => {
  const r = ROOMS[id], s = SITE[r.site];
  const lights = DEV.filter(d => d.type === 'light' && d.room === id);
  const clim = climateOf(id);
  const devs = DEV.filter(d => d.room === id && ['tv','washer','dishwasher'].includes(d.type));
  const parts = [pushedHeader(r.name, `${s.short} · ${groupOf(id)}`)];
  if (lights.length) parts.push(sec('Licht', tileGrid(lights, d => tile(d)), lights.some(l => l.on) ? `<button class="link" data-act="room-lights-off" data-id="${id}">Alle aus</button>` : ''));
  if (clim){
    const heat = isHeating(clim);
    parts.push(sec('Heizung', `<div class="tiles"><button class="ctile wide-span ${heat ? 'heating' : ''}" data-act="therm" data-id="${clim.id}"><span class="ctile-top"><span class="ctile-room">Raumtemperatur</span></span><span class="ctile-temp">${temp(r.temp)}</span><span class="ctile-sub">${ic(heat ? 'mode_heat' : clim.mode === 'eco' ? 'eco' : 'check', 'f')}${esc(climText(clim))}</span></button></div>`));
  }
  if (devs.length) parts.push(sec('Geräte', tileGrid(devs, d => tile(d))));
  const kv = [`<div class="kv"><span>${ic('device_thermostat')}Temperatur</span><b>${f1(r.temp)} °C</b></div>`];
  if (r.hum) kv.push(`<div class="kv"><span>${ic('humidity_percentage')}Luftfeuchte</span><b>${r.hum} %</b></div>`);
  parts.push(sec('Raumklima', `<div class="list">${kv.join('')}</div>`));
  if (!lights.length && !clim && !devs.length) parts.splice(1, 0, `<div class="card empty">In diesem Raum sind noch keine Geräte. Sobald in Home Assistant etwas diesem Raum zugeordnet ist, erscheint es hier.</div>`);
  return {nav: navBar(r.name), body: parts.join('')};
};

function climText(c){
  if (c.mode === 'off') return 'Aus';
  if (isHeating(c)) return `Heizt auf ${f1(effTarget(c))}°`;
  if (c.mode === 'eco') return `Eco · ${f1(effTarget(c))}°`;
  return `Hält ${f1(c.target)}°`;
}

ROOT.heizung = () => {
  const sources = ['gas1','gas2','holz','oel'].map(id => SUP[id]).filter(supMatch);
  const clims = DEV.filter(d => d.type === 'climate' && siteMatch(devSite(d)));
  const heatingN = clims.filter(isHeating).length;
  const showSeason = siteMatch('a2') || siteMatch('m1');
  const season = showSeason ? `<div class="card season"><div class="season-txt"><strong>Ammerhofweg 2</strong><span>wird gerade beheizt mit</span></div>
    <div class="seg" role="radiogroup" aria-label="Wärmequelle Ammerhofweg 2">
      <button role="radio" aria-checked="${state.season === 'winter'}" class="${state.season === 'winter' ? 'sel' : ''}" data-act="season" data-v="winter">${ic('fireplace', 'f')}Holz · Winter</button>
      <button role="radio" aria-checked="${state.season === 'sommer'}" class="${state.season === 'sommer' ? 'sel' : ''}" data-act="season" data-v="sommer">${ic('oil_barrel', 'f')}Öl · Sommer</button>
    </div></div>` : '';
  const ctiles = clims.map(c => {
    const r = ROOMS[c.room], heat = isHeating(c);

  }).join('');
  return {body: [
    rootHeader('Heizung', heatingN ? `${heatingN} Räume heizen gerade` : 'Alle Räume sind warm'),
    sources.length ? sec('Wärmequellen', `<div class="list">${sources.map(supplyRow).join('')}</div>`) : '',
    season,

};

ROOT.versorgung = () => {

function servesSection(s){

      .map(([l, site]) => ({label:l, site, val:'gemessen'}));
  } else if (s.id === 'strom2'){
    rows = STROM2_SERVES.map(x => ({label:x.label, site:x.site, val: x.kw != null ? `${f1(x.kw)} kW` : 'nicht gemessen', dim: x.kw == null}));
  } else if (s.id === 'holz'){

}

/* ---------- Diagramm ---------- */
const CH = {W:340, H:190, ml:28, mr:10, mt:16, mb:22};
CH.pw = CH.W - CH.ml - CH.mr; CH.ph = CH.H - CH.mt - CH.mb;
CH.ymax = Math.ceil(Math.max(...PV, ...LOAD) / 2) * 2;
const cx = t => CH.ml + t / 24 * CH.pw;
const cy = v => CH.mt + CH.ph - v / CH.ymax * CH.ph;
const hhmm = t => `${String(Math.floor(t)).padStart(2, '0')}:${String(Math.round((t % 1) * 60)).padStart(2, '0')}`;
function energyChart(){
  const {W, H, ml, mt, ph, ymax} = CH;
  let g = '';
  for (let v = 0; v <= ymax; v += 2){
    g += `<line class="${v === 0 ? 'base' : 'gl'}" x1="${ml}" x2="${W - CH.mr}" y1="${cy(v)}" y2="${cy(v)}"/>`;
    g += `<text class="ax" x="${ml - 6}" y="${cy(v) + 3.5}" text-anchor="end">${v}${v === ymax ? ' kW' : ''}</text>`;
  }
  [0, 6, 12, 18, 24].forEach(t => {
    g += `<text class="ax" x="${cx(t)}" y="${H - 6}" text-anchor="${t === 0 ? 'start' : t === 24 ? 'end' : 'middle'}">${t === 24 ? '24 Uhr' : t}</text>`;
  });
  const line = arr => arr.map((v, i) => `${i ? 'L' : 'M'}${cx(T[i]).toFixed(1)} ${cy(v).toFixed(1)}`).join('');
  const pvL = line(PV), ldL = line(LOAD);
  const pvA = `${pvL}L${cx(NOW_H).toFixed(1)} ${cy(0)}L${cx(0)} ${cy(0)}Z`;
  const nx = cx(NOW_H);
  return `<div class="legend"><span><i style="background:var(--s2)"></i>Solar <b>${f1(NOW.pv)} kW</b></span><span><i style="background:var(--s1)"></i>Verbrauch <b>${f1(NOW.load)} kW</b></span></div>
  <div class="echart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Solar und Verbrauch heute bis 15:30. Solar jetzt ${f1(NOW.pv)} Kilowatt, Verbrauch ${f1(NOW.load)} Kilowatt.">
    ${g}
    <path class="pv-area" d="${pvA}"/>
    <path class="pv-line" d="${pvL}"/>
    <path class="ld-line" d="${ldL}"/>
    <line class="now-line" x1="${nx}" x2="${nx}" y1="${mt}" y2="${mt + ph}"/>
    <text class="ax" x="${nx + 4}" y="${mt + 2}" text-anchor="start">jetzt</text>
    <circle class="dot pv" cx="${nx}" cy="${cy(NOW.pv)}" r="4.5"/>
    <circle class="dot ld" cx="${nx}" cy="${cy(NOW.load)}" r="4.5"/>
    <line class="cross" x1="0" x2="0" y1="${mt}" y2="${mt + ph}" visibility="hidden"/>
    <circle class="dot pv hdot-pv" r="4.5" visibility="hidden"/>
    <circle class="dot ld hdot-ld" r="4.5" visibility="hidden"/>
    <rect x="${ml}" y="${mt}" width="${CH.pw}" height="${ph}" fill="transparent" class="hit"/>
  </svg><div class="tip" hidden></div></div>`;
}
function bindCharts(){
  screen.querySelectorAll('.echart').forEach(wrap => {
    const svg = wrap.querySelector('svg'), tip = wrap.querySelector('.tip');
    const cross = svg.querySelector('.cross'), dp = svg.querySelector('.hdot-pv'), dl = svg.querySelector('.hdot-ld');
    const hide = () => { tip.hidden = true; [cross, dp, dl].forEach(e => e.setAttribute('visibility', 'hidden')); };
    const move = ev => {
      const r = svg.getBoundingClientRect();
      const px = (ev.clientX - r.left) / r.width * CH.W;
      const t = (px - CH.ml) / CH.pw * 24;
      if (t < 0 || t > 24){ hide(); return; }
      const i = Math.max(0, Math.min(T.length - 1, Math.round(Math.min(t, NOW_H) / STEP)));
      const x = cx(T[i]);
      cross.setAttribute('x1', x); cross.setAttribute('x2', x);
      dp.setAttribute('cx', x); dp.setAttribute('cy', cy(PV[i]));
      dl.setAttribute('cx', x); dl.setAttribute('cy', cy(LOAD[i]));
      [cross, dp, dl].forEach(e => e.setAttribute('visibility', 'visible'));
      tip.innerHTML = `<div class="tip-t">${hhmm(T[i])} Uhr</div><div><i style="background:var(--s2)"></i>Solar <b>${f1(PV[i])} kW</b></div><div><i style="background:var(--s1)"></i>Verbrauch <b>${f1(LOAD[i])} kW</b></div>`;
      tip.hidden = false;
      const pct = x / CH.W * 100;
      tip.style.left = `${Math.max(22, Math.min(78, pct))}%`;
    };
    svg.addEventListener('pointermove', move);
    svg.addEventListener('pointerdown', move);
    svg.addEventListener('pointerleave', hide);
  });
}

/* ---------- Sicherheit ---------- */
ROOT.sicherheit = () => {
  const doors = DOORS.filter(d => siteMatch(d.site));
  const cams = CAMS.filter(c => siteMatch(c.site));
  const open = doors.filter(d => d.state === 'open' || d.state === 'unlocked');
  const status = open.length
    ? `<div class="statusbox warn">${ic('warning', 'f')}<div><strong>${open.length === 1 ? esc(open[0].name) + ' ist offen' : open.length + ' Türen oder Tore offen'}</strong><span>${open.length === 1 ? esc(SITE[open[0].site].short) + (open[0].since ? ' · ' + esc(open[0].since) : '') : 'Unten tippen zum Schließen'}</span></div></div>`
    : `<div class="statusbox ok">${ic('check_circle', 'f')}<div><strong>Alles verschlossen</strong><span>${doors.length} Türen und Tore</span></div></div>`;
  const doorRows = doors.map(d => {
    const isOpen = d.state === 'open' || d.state === 'unlocked';
    const stateText = d.state === 'locked' ? 'Verriegelt' : d.state === 'unlocked' ? 'Kurz entriegelt' : d.state === 'open' ? 'Offen' : 'Geschlossen';
    const btn = d.kind === 'gate'
      ? `<button class="btn sm ${isOpen ? '' : 'ghost'}" data-act="door" data-id="${d.id}">${isOpen ? 'Schließen' : 'Öffnen'}</button>`
      : `<button class="btn sm ghost" data-act="door" data-id="${d.id}" ${d.state === 'unlocked' ? 'disabled' : ''}>Öffnen</button>`;
    return `<div class="row"><span class="row-ic" style="--c:var(${isOpen ? '--warn' : '--ok'})">${ic(d.kind === 'gate' ? 'door_sliding' : (isOpen ? 'lock_open' : 'door_front'), 'f')}</span><span class="row-main"><span class="row-title">${esc(d.name)}</span><span class="row-sub">${esc(SITE[d.site].short)} · ${stateText}</span></span>${btn}</div>`;
  }).join('');
  const camHtml = cams.map((c, i) => camTile(c, cams.length % 2 === 1 && i === 0 ? 'wide-span' : '')).join('');
  const ev = EVENTS.filter(e => siteMatch(e.cam ? CAMI[e.cam].site : DOORI[e.door].site)).map(e => {
    const where = e.cam ? CAMI[e.cam].name : DOORI[e.door].name;
    return `<div class="row"><span class="row-ic soft">${ic(e.icon, 'f')}</span><span class="row-main"><span class="row-title">${esc(e.what)}</span><span class="row-sub">${esc(where)}</span></span><span class="row-end"><span class="row-val dim">${e.t}</span></span></div>`;
  }).join('');
  return {body: [
    rootHeader('Sicherheit', 'Zugang · Kameras'),
    status,
    doors.length ? sec('Türen & Tore', `<div class="list">${doorRows}</div>`) : '',
    cams.length ? sec('Kameras', `<div class="cams">${camHtml}</div>`) : '',
    ev ? sec('Heute', `<div class="list">${ev}</div>`) : '',
  ].join('')};
};

/* ---------- Bottom-Sheets ---------- */
function sheetHead(eyebrow, title){
  return `<div class="sheet-head" data-drag><div><span class="sheet-eyebrow">${esc(eyebrow)}</span><h3 id="sheetTitle">${esc(title)}</h3></div><button class="x" data-act="sheet-close" aria-label="Schließen">${ic('close')}</button></div>`;
}
const SHEETS = {
  site(){
    const opts = [{id:'alle', name:'Alle Standorte', role:'Alles auf einen Blick', icon:'location_on'}, ...SITES];
    return sheetHead('Anzeigen für', 'Standort wählen') + `<div class="list">${opts.map(o => `<button class="row" data-act="set-site" data-id="${o.id}" role="radio" aria-checked="${state.site === o.id}"><span class="row-ic soft">${ic(o.icon, 'f')}</span><span class="row-main"><span class="row-title">${esc(o.name)}</span><span class="row-sub">${esc(o.role)}</span></span>${state.site === o.id ? `<span class="ms" style="color:var(--accent)" aria-hidden="true">check</span>` : ''}</button>`).join('')}</div>`;
  },
  light(id){
    const d = DEVI[id], r = ROOMS[d.room];
    const v = d.on ? d.bri : 0;
    return sheetHead(`${r.name} · ${SITE[r.site].short}`, d.name) + `<div class="vwrap"><div class="vslider ${d.on ? '' : 'off'}" id="vslider" role="slider" tabindex="0" aria-label="Helligkeit" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${v}"><div class="vfill" style="height:${v}%"></div>${ic('lightbulb', 'f vicon')}</div><div class="vval" id="vval">${d.on ? d.bri + ' %' : 'Aus'}</div></div><button class="btn wide ${d.on ? 'ghost' : ''}" data-act="toggle" data-id="${id}">${d.on ? 'Ausschalten' : 'Einschalten'}</button>`;
  },
  therm(id){
    const c = DEVI[id], r = ROOMS[c.room];
    const heat = isHeating(c), t = effTarget(c);
    const A0 = Math.PI * 0.75, SW = Math.PI * 1.5, MIN = 5, MAX = 30;
    const ang = v => A0 + (Math.min(MAX, Math.max(MIN, v)) - MIN) / (MAX - MIN) * SW;
    const P = (a, rad) => [120 + rad * Math.cos(a), 116 + rad * Math.sin(a)];
    const arc = (a0, a1) => { const [x0, y0] = P(a0, 92), [x1, y1] = P(a1, 92); return `M${x0.toFixed(1)} ${y0.toFixed(1)} A92 92 0 ${a1 - a0 > Math.PI ? 1 : 0} 1 ${x1.toFixed(1)} ${y1.toFixed(1)}`; };
    const [mx, my] = P(ang(r.temp), 92);
    const state_ = c.mode === 'off' ? 'Aus' : heat ? 'Heizt' : c.mode === 'eco' ? 'Eco' : 'Hält die Temperatur';
    return sheetHead(SITE[r.site].short, r.name) + `<div class="therm"><svg viewBox="0 0 240 210" aria-hidden="true"><path class="therm-track" d="${arc(A0, A0 + SW)}"/>${c.mode === 'off' ? '' : `<path class="therm-val ${heat ? '' : 'idle'}" d="${arc(A0, ang(t))}"/>`}<circle class="therm-cur" cx="${mx.toFixed(1)}" cy="${my.toFixed(1)}" r="6"/></svg>
      <div class="therm-center"><span class="therm-state ${heat ? 'heating' : ''}">${state_}</span><span class="therm-target" aria-live="polite">${c.mode === 'off' ? '—' : f1(t) + '°'}</span><span class="therm-now">Raum ${f1(r.temp)}°${r.hum ? ` · ${r.hum} %` : ''}</span></div></div>
      <div class="therm-ctrl"><button class="round" data-act="therm-step" data-d="-0.5" aria-label="Kälter" ${c.mode !== 'heat' ? 'disabled' : ''}>${ic('remove')}</button><button class="round" data-act="therm-step" data-d="0.5" aria-label="Wärmer" ${c.mode !== 'heat' ? 'disabled' : ''}>${ic('add')}</button></div>
      <div class="seg" role="radiogroup" aria-label="Betriebsart">${[['heat','Heizen','mode_heat'], ['eco','Eco','eco'], ['off','Aus','power_settings_new']].map(([v, l, i]) => `<button role="radio" aria-checked="${c.mode === v}" class="${c.mode === v ? 'sel' : ''}" data-act="therm-mode" data-v="${v}">${ic(i, 'f')}${l}</button>`).join('')}</div>
      <p class="hint">Eco hält den Raum bei 17°, zum Beispiel wenn niemand da ist.</p>`;
  },
  tv(id){
    const d = DEVI[id], r = ROOMS[d.room];
    return sheetHead(`${r.name} · ${SITE[r.site].short}`, d.name) + `<div class="center"><button class="round xl ${d.on ? 'on' : ''}" data-act="toggle" data-id="${id}" aria-label="${d.on ? 'Ausschalten' : 'Einschalten'}">${ic('power_settings_new')}</button></div>
      <div class="card vol"><button class="round" data-act="tv-vol" data-d="-2" aria-label="Leiser" ${d.on ? '' : 'disabled'}>${ic('remove')}</button><div class="vol-mid"><span class="vol-l">Lautstärke</span><span class="vol-v">${d.on ? d.vol : '—'}</span></div><button class="round" data-act="tv-vol" data-d="2" aria-label="Lauter" ${d.on ? '' : 'disabled'}>${ic('add')}</button></div>
      <span class="h4">Quelle</span><div class="srcs">${['TV','Apple TV','HDMI 1','HDMI 2'].map(s => `<button class="src ${d.on && d.source === s ? 'sel' : ''}" data-act="tv-src" data-v="${s}" ${d.on ? '' : 'disabled'}>${s}</button>`).join('')}</div>`;
  },
  appl(id){
    const d = DEVI[id], r = ROOMS[d.room];
    let body = '';
    if (d.state === 'run'){
      const p = 1 - d.remain / d.total, C = 2 * Math.PI * 76;
      const end = new Date(Date.now() + d.remain * 60000);
      body = `<div class="ring-wrap"><svg viewBox="0 0 180 180" aria-hidden="true"><circle class="ring-bg" cx="90" cy="90" r="76"/><circle class="ring-fg" cx="90" cy="90" r="76" stroke-dasharray="${(C * p).toFixed(1)} ${C.toFixed(1)}" transform="rotate(-90 90 90)"/></svg><div class="ring-mid"><b>${d.remain}</b><span>Min. übrig</span></div></div>`
        + kvList([['Programm', d.program, d.type === 'washer' ? 'local_laundry_service' : 'dishwasher_gen'], ['Fertig um', `${String(end.getHours()).padStart(2, '0')}:${String(end.getMinutes()).padStart(2, '0')} Uhr`, 'schedule']]);
    } else if (d.state === 'done'){
      body = `<div class="done-ic">${ic('check', 'f')}</div><p class="lede" style="text-align:center">Fertig seit ${d.doneAgo} Minuten · ${esc(d.program)}</p><button class="btn wide" data-act="appl-done" data-id="${id}">Erledigt, ausgeräumt</button>`;
    } else {
      body = `<p class="lede">Bereit. Zuletzt: ${esc(d.program)}.</p>`;
    }
    return sheetHead(`${r.name} · ${SITE[r.site].short}`, d.name) + body
      + `<div class="list"><div class="row"><span class="row-ic" style="--c:var(--accent)">${ic('notifications', 'f')}</span><span class="row-main"><span class="row-title">Mitteilung, wenn fertig</span><span class="row-sub">aufs iPhone und die Apple Watch</span></span><button class="switch ${d.notify ? 'on' : ''}" role="switch" aria-checked="${d.notify}" aria-label="Mitteilung, wenn fertig" data-act="notify" data-id="${id}"></button></div></div>`;
  },
  cam(id){
    const c = CAMI[id];
    const ev = EVENTS.filter(e => e.cam === id);
    return sheetHead(SITE[c.site].short, c.name) + camTile(c, 'big')
      + (ev.length ? `<div class="list">${ev.map(e => `<div class="row"><span class="row-ic soft">${ic(e.icon, 'f')}</span><span class="row-main"><span class="row-title">${esc(e.what)}</span></span><span class="row-end"><span class="row-val dim">${e.t}</span></span></div>`).join('')}</div>` : '<p class="hint">Heute keine Ereignisse.</p>');
  },
  lights(){
    const on = lightsIn(d => d.on && siteMatch(devSite(d)));
    return sheetHead(state.site === 'alle' ? 'Alle Standorte' : SITE[state.site].short, on.length ? `${on.length} ${on.length === 1 ? 'Licht' : 'Lichter'} an` : 'Alle Lichter sind aus')
      + (on.length ? `<div class="list">${on.map(d => { const r = ROOMS[d.room]; return `<div class="row"><span class="row-ic" style="--c:var(--c-light)">${ic('lightbulb', 'f')}</span><span class="row-main"><span class="row-title">${esc(r.name)} · ${esc(d.name)}</span><span class="row-sub">${esc(SITE[r.site].short)} · ${d.bri} %</span></span><button class="switch on" role="switch" aria-checked="true" aria-label="${esc(r.name)} ${esc(d.name)} ausschalten" data-act="toggle" data-id="${d.id}"></button></div>`; }).join('')}</div><button class="btn wide" data-act="all-lights-off">${ic('power_settings_new')}Alle ausschalten</button>` : '<p class="lede">Nirgends brennt mehr Licht.</p>');
  },
};

function openSheet(type, id){
  state.sheet = {type, id};
  renderSheet();
  layer.hidden = false;
  requestAnimationFrame(() => requestAnimationFrame(() => layer.classList.add('open')));
}
function closeSheet(){
  if (!state.sheet) return;
  layer.classList.remove('open');
  sheet.style.transform = '';
  state.sheet = null;
  setTimeout(() => { if (!state.sheet){ layer.hidden = true; sheet.innerHTML = ''; } }, 300);
}
function renderSheet(){
  if (!state.sheet) return;
  const {type, id} = state.sheet;
  const keep = sheet.scrollTop;
  sheet.innerHTML = `<div class="grab" data-drag aria-hidden="true"></div>` + SHEETS[type](id);
  sheet.scrollTop = keep;
  bindSlider();
}
function bindSlider(){
  const sl = sheet.querySelector('#vslider');
  if (!sl) return;
  const d = DEVI[state.sheet.id];
  const fill = sl.querySelector('.vfill'), val = sheet.querySelector('#vval');
  const set = pct => {
    pct = Math.max(0, Math.min(100, Math.round(pct)));
    fill.style.height = pct + '%';
    val.textContent = pct ? pct + ' %' : 'Aus';
    sl.setAttribute('aria-valuenow', pct);
    sl.classList.toggle('off', !pct);
    d.on = pct > 0; if (pct > 0) d.bri = pct;
  };
  const fromEvent = ev => { const r = sl.getBoundingClientRect(); return (r.bottom - ev.clientY) / r.height * 100; };
  let dragging = false;
  sl.addEventListener('pointerdown', ev => { dragging = true; sl.setPointerCapture(ev.pointerId); set(fromEvent(ev)); });
  sl.addEventListener('pointermove', ev => { if (dragging) set(fromEvent(ev)); });
  const end = () => { if (!dragging) return; dragging = false; render(); renderSheet(); };
  sl.addEventListener('pointerup', end); sl.addEventListener('pointercancel', end);
  sl.addEventListener('keydown', ev => {
    const step = ev.key === 'ArrowUp' || ev.key === 'ArrowRight' ? 10 : ev.key === 'ArrowDown' || ev.key === 'ArrowLeft' ? -10 : 0;
    if (!step) return;
    ev.preventDefault(); set((d.on ? d.bri : 0) + step); render(); renderSheet(); sheet.querySelector('#vslider').focus();
  });
}
/* Sheet nach unten wischen zum Schließen */
(() => {
  let y0 = null, dy = 0;
  sheet.addEventListener('pointerdown', ev => {
    if (!ev.target.closest('[data-drag]') || ev.target.closest('button')) return;
    y0 = ev.clientY; dy = 0; sheet.style.transition = 'none'; sheet.setPointerCapture(ev.pointerId);
  });
  sheet.addEventListener('pointermove', ev => { if (y0 === null) return; dy = Math.max(0, ev.clientY - y0); sheet.style.transform = `translateY(${dy}px)`; });
  const up = () => { if (y0 === null) return; y0 = null; sheet.style.transition = ''; if (dy > 90) closeSheet(); else sheet.style.transform = ''; };
  sheet.addEventListener('pointerup', up); sheet.addEventListener('pointercancel', up);
})();

/* ---------- Rendern & Navigation ---------- */
function renderTabbar(){
  tabbar.innerHTML = TABS.map(t => `<button class="tab ${state.tab === t.id ? 'active' : ''}" data-act="tab" data-tab="${t.id}" aria-current="${state.tab === t.id ? 'page' : 'false'}">${ic(t.icon)}<span>${t.label}</span></button>`).join('');
}
function render(){
  const st = state.stacks[state.tab];
  const top = st[st.length - 1];
  const out = top ? PAGES[top.page](top.id) : ROOT[state.tab]();
  screen.innerHTML = (out.nav || '') + `<div class="view ${state.anim ? 'anim-' + state.anim : ''}">${out.body}</div>`;
  device.classList.toggle('root', !top);
  state.anim = null;
  renderTabbar();
  bindCharts();
  onScroll();
}
function saveScroll(){
  const st = state.stacks[state.tab];
  if (st.length) st[st.length - 1].scroll = screen.scrollTop; else state.rootScroll[state.tab] = screen.scrollTop;
}
function restoreScroll(){
  const st = state.stacks[state.tab];
  screen.scrollTop = st.length ? (st[st.length - 1].scroll || 0) : (state.rootScroll[state.tab] || 0);
}
function push(page, id){
  saveScroll();
  state.stacks[state.tab].push({page, id, scroll:0});
  state.anim = 'push'; render(); screen.scrollTop = 0;
}
function back(){
  const st = state.stacks[state.tab];
  if (!st.length) return;
  st.pop(); state.anim = 'pop'; render(); restoreScroll();
}
function switchTab(tab){
  if (tab === state.tab){
    if (state.stacks[tab].length){ state.stacks[tab] = []; state.anim = 'pop'; render(); screen.scrollTop = 0; }
    else screen.scrollTo({top:0, behavior:'smooth'});
    return;
  }
  saveScroll(); state.tab = tab; state.anim = 'tab'; render(); restoreScroll();
}
function onScroll(){ device.classList.toggle('scrolled', screen.scrollTop > 18); }
screen.addEventListener('scroll', onScroll, {passive:true});

/* ---------- Aktionen ---------- */
function toggleDev(id){
  const d = DEVI[id];
  if (d.type === 'light' || d.type === 'tv') d.on = !d.on;
}
function lightsOff(fn){ let n = 0; DEV.forEach(d => { if (d.type === 'light' && d.on && fn(d)){ d.on = false; n++; } }); return n; }
function primary(id){
  const d = DEVI[id];
  if (d.type === 'light' || d.type === 'tv') toggleDev(id);
  else if (d.type === 'washer' || d.type === 'dishwasher') openSheet('appl', id);
}
function openDev(id){
  const d = DEVI[id];
  if (d.type === 'light') openSheet('light', id);
  else if (d.type === 'tv') openSheet('tv', id);
  else if (d.type === 'washer' || d.type === 'dishwasher') openSheet('appl', id);
  else if (d.type === 'climate') openSheet('therm', id);
}
const unlockTimers = {};
function doorAction(id){
  const d = DOORI[id];
  if (d.kind === 'gate'){
    if (d.state === 'open'){ d.state = 'closed'; d.since = ''; toast(`${d.name} wird geschlossen`); }
    else { d.state = 'open'; d.since = 'gerade eben'; toast(`${d.name} wird geöffnet`); }
  } else {
    d.state = 'unlocked'; toast(`${d.name} ist 5 Sekunden offen`);
    clearTimeout(unlockTimers[id]);
    unlockTimers[id] = setTimeout(() => { d.state = 'locked'; render(); renderSheet(); }, 5000);
  }
}
function scene(id){
  if (id === 'feierabend'){
    lightsOff(d => devSite(d) === 'm1');
    DOORS.filter(d => d.site === 'm1').forEach(d => { d.state = d.kind === 'gate' ? 'closed' : 'locked'; d.since = ''; });
    toast('Feierabend: Firma ist zu');
  } else if (id === 'nacht'){
    lightsOff(d => devSite(d) === 'm1a');
    DEV.filter(d => d.type === 'tv' && devSite(d) === 'm1a').forEach(d => { d.on = false; });
    DOORI.d_haustuer.state = 'locked';
    toast('Gute Nacht');
  } else {
    const n = lightsOff(d => siteMatch(devSite(d)));
    toast(n ? `${n} ${n === 1 ? 'Licht' : 'Lichter'} ausgeschaltet` : 'Es war schon alles aus');
  }
}

let longPressed = false, lpTimer = null, lpStart = null;
device.addEventListener('pointerdown', ev => {
  const t = ev.target.closest('[data-tile]');
  if (!t) return;
  longPressed = false; lpStart = [ev.clientX, ev.clientY];
  clearTimeout(lpTimer);
  lpTimer = setTimeout(() => { longPressed = true; openDev(t.dataset.tile); }, 450);
});
device.addEventListener('pointermove', ev => {
  if (!lpStart) return;
  if (Math.abs(ev.clientX - lpStart[0]) > 8 || Math.abs(ev.clientY - lpStart[1]) > 8){ clearTimeout(lpTimer); lpStart = null; }
});
['pointerup','pointercancel'].forEach(n => device.addEventListener(n, () => { clearTimeout(lpTimer); lpStart = null; }));
device.addEventListener('contextmenu', ev => { if (ev.target.closest('[data-tile]')) ev.preventDefault(); });

device.addEventListener('click', ev => {
  const tileEl = ev.target.closest('[data-tile]');
  if (tileEl){
    if (longPressed){ longPressed = false; return; }
    primary(tileEl.dataset.tile); render(); renderSheet(); return;
  }
  const el = ev.target.closest('[data-act]');
  if (!el) return;
  const {act, id} = el.dataset;
  switch (act){
    case 'tab': closeSheet(); switchTab(el.dataset.tab); return;
    case 'push': push(el.dataset.page, id); return;
    case 'back': back(); return;
    case 'site-sheet': openSheet('site'); return;
    case 'lights-sheet': openSheet('lights'); return;
    case 'set-site': state.site = id; closeSheet(); render(); screen.scrollTop = 0; return;
    case 'sheet-close': closeSheet(); return;
    case 'open': openDev(id); return;
    case 'therm': openSheet('therm', id); return;
    case 'cam': openSheet('cam', id); return;
    case 'toggle': toggleDev(id); break;
    case 'scene': scene(id); break;
    case 'door': doorAction(id); break;
    case 'season': state.season = el.dataset.v; break;
    case 'site-lights-off': { const n = lightsOff(d => devSite(d) === id); toast(`${n} ${n === 1 ? 'Licht' : 'Lichter'} ausgeschaltet`); break; }
    case 'room-lights-off': lightsOff(d => d.room === id); break;
    case 'all-lights-off': { const n = lightsOff(d => siteMatch(devSite(d))); toast(`${n} ${n === 1 ? 'Licht' : 'Lichter'} ausgeschaltet`); break; }
    case 'therm-step': { const c = DEVI[state.sheet.id]; c.target = Math.max(5, Math.min(30, c.target + parseFloat(el.dataset.d))); break; }
    case 'therm-mode': DEVI[state.sheet.id].mode = el.dataset.v; break;
    case 'tv-vol': { const d = DEVI[state.sheet.id]; d.vol = Math.max(0, Math.min(100, d.vol + parseInt(el.dataset.d, 10))); break; }
    case 'tv-src': DEVI[state.sheet.id].source = el.dataset.v; break;
    case 'notify': { const d = DEVI[id]; d.notify = !d.notify; break; }
    case 'appl-done': { const d = DEVI[id]; d.state = 'idle'; if (state.sheet && state.sheet.id === id) closeSheet(); toast(`${d.name}: erledigt`); break; }
    default: return;
  }
  render(); renderSheet();
});
document.addEventListener('keydown', ev => { if (ev.key === 'Escape') closeSheet(); });

render();
})();
</script>
