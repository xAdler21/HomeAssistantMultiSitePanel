# Beispielkonfiguration des Multi-Site Panels (Adressen und Geräte sind ausgedacht)
# Seit Version 0.2 wird alles im Editor („Zuhause bearbeiten“) gepflegt. Diese Datei dient als Vorlage:
# Liegt sie beim ersten Einrichten der Integration unter /homeassistant/art_custom/multisite-panel.yaml,
# wird sie übernommen. Später lässt sie sich im Editor unter YAML einfügen.
# Nicht nach art_configs legen, sonst lädt HA sie als eigenes Paket.
#
# Platzhalter in GROSSBUCHSTABEN durch echte Entitäten ersetzen und die Zeile einkommentieren.

wetter: weather.forecast_home
aussentemperatur: sensor.THERME_AUSSENTEMPERATUR

# Geräte mit diesem Label erscheinen auf der Startseite unter „Favoriten“
favoriten_label: favorit

# ---------------------------------------------------------------------------
# Standorte
# etagen: Etagen aus Home Assistant (ID oder Name). Alle Räume dieser Etagen gehören zum Standort.
# bereiche: zusätzliche Räume ohne Etage (z. B. Hof, Garten).
# Ein Gebäude ohne Stockwerke bekommt einfach eine Etage mit seinem Namen.
# ---------------------------------------------------------------------------
standorte:
  - id: firma
    name: Lindenstraße 4
    kurz: Lindenstraße 4
    kuerzel: Firma
    rolle: Firma
    icon: mdi:office-building
    etagen:
      - Werkstatt
      - Büro          # Räume z. B. „Büro links“, „Büro rechts“, „Büro Anbau“
      - Neue Halle
      - Stadel
    bereiche:
      - Hof
    bereiche_titel: Außen

  - id: haus
    name: Lindenstraße 4a
    kurz: Lindenstraße 4a
    kuerzel: 4a
    rolle: Wohnhaus
    icon: mdi:home
    etagen:
      - 1. Stock
      - Erdgeschoss
      - Keller
    bereiche:
      - Aussen
    bereiche_titel: Außen

  - id: birke
    name: Birkenweg 7
    kurz: Birkenweg 7
    kuerzel: Birkenweg
    rolle: Gästehaus
    icon: mdi:home-variant
    etagen:
      - Birkenweg

  - id: feld
    name: Am Feld 1
    kurz: Am Feld 1
    kuerzel: Feld
    rolle: Wohnhaus & Halle
    icon: mdi:warehouse
    etagen:
      - id: Feld Wohnhaus
        name: Wohnhaus
      - id: Feld Halle
        name: Halle

# ---------------------------------------------------------------------------
# Lagepläne: Bild hochladen und Lichter platzieren geht nur im Editor (das Bild bleibt in Home Assistant).
# x/y: Position in Prozent von links/oben.
# ---------------------------------------------------------------------------
# plaene:
#   - id: areal
#     name: Areal
#     bild: plan-0123456789abcdef.jpg   # vom Editor vergeben
#     breite: 6000
#     hoehe: 4000
#     punkte:
#       - entity: light.HOF
#         x: 48.5
#         y: 61.2

# ---------------------------------------------------------------------------
# Heizbetrieb Winter/Sommer (z. B. Holz im Winter, Öl im Sommer)
# Ohne entity gilt automatisch: Oktober bis April = Winter.
# Mit einem input_select (Optionen „Winter“ und „Sommer“) kann man in der App umschalten.
# ---------------------------------------------------------------------------
heizsaison:
  # entity: input_select.heizsaison
  titel: Heizbetrieb
  text: Holz im Winter, Öl im Sommer

# ---------------------------------------------------------------------------
# Versorgung: ein Eintrag pro Anschluss
# art: strom | gas | holz | oel | waerme | waermepumpe | wasser | brunnen | internet | sonstiges
# messung: voll | teilweise | therme | keine | geplant | offen
# leistung/solar/netz: aktuelle Leistung in W oder kW (netz: + Bezug, − Einspeisung; sonst netz_umkehren: true)
# *_heute: Tageswerte in kWh (z. B. per Zähler-Helfer „Utility Meter“, täglicher Zyklus)
# ---------------------------------------------------------------------------
versorgung:
  - id: strom1
    art: strom
    name: "Strom · Zähler 1"
    ort: Lindenstraße 4
    standorte: [firma]
    messung: voll
    # leistung: sensor.ZAEHLER1_LEISTUNG
    # solar: sensor.PV_LEISTUNG
    # netz: sensor.ZAEHLER1_NETZLEISTUNG
    # verbrauch_heute: sensor.ZAEHLER1_VERBRAUCH_HEUTE
    # solar_heute: sensor.PV_ERTRAG_HEUTE
    # einspeisung_heute: sensor.ZAEHLER1_EINSPEISUNG_HEUTE
    versorgt:
      - name: Werkstatt
        standort: firma
        # leistung: sensor.WERKSTATT_LEISTUNG
      - name: Büro
        standort: firma
      - name: Neue Halle
        standort: firma
      - name: Wallbox
        standort: firma
        # leistung: sensor.WALLBOX_LEISTUNG
    geplant:
      - Zweite PV-Anlage
      - Stromspeicher

  - id: strom2
    art: strom
    name: "Strom · Zähler 2"
    ort: Birkenweg 7
    standorte: [birke, haus, feld]
    messung: teilweise
    hinweis: Der Gesamtverbrauch an diesem Zähler wird noch nicht gemessen.
    versorgt:
      - name: Gästehaus
        standort: birke
      - name: Wohnhaus 4a
        standort: haus
        # leistung: sensor.WOHNHAUS_LEISTUNG
      - name: Am Feld
        standort: feld

  - id: gas1
    art: gas
    name: Gas 1
    ort: Lindenstraße 4a
    standorte: [haus]
    messung: therme
    hinweis: Die Werte kommen direkt aus der Therme. Der Gasverbrauch ist die Schätzung der Therme, nicht der Gaszähler.
    # verbrauch_heute: sensor.THERME_GAS_HEUTE
    werte_titel: Therme
    # werte:
    #   - name: Vorlauf
    #     entity: sensor.THERME_VORLAUF
    #     icon: mdi:thermometer
    #   - name: Warmwasser
    #     entity: sensor.THERME_WARMWASSER
    #     icon: mdi:water-thermometer

  - id: holz
    art: holz
    name: Holzheizung
    standorte: [firma, birke]
    saison: winter
    messung: offen
    beschreibung: Büro, Wohnung · im Winter auch Birkenweg 7

  - id: oel
    art: oel
    name: Ölheizung
    ort: Birkenweg 7
    standorte: [birke]
    saison: sommer
    messung: offen

  - id: brunnen
    art: brunnen
    name: Brunnen
    standorte: [firma, haus, feld]
    messung: geplant
    beschreibung: alle Gebäude außer Birkenweg 7

  - id: internet
    art: internet
    name: Internet
    ort: Lindenstraße 4
    standorte: [firma, haus, birke, feld]
    beschreibung: kommt in der Lindenstraße 4 an · versorgt alles
    # status: binary_sensor.ROUTER_INTERNET        # device_class connectivity → „Online“/„Offline“

# ---------------------------------------------------------------------------
# Haushaltsgeräte (Status-Entität und/oder Leistungsmessung per Zwischenstecker)
# art: waschmaschine | trockner | spuelmaschine | backofen | kaffeemaschine
# ---------------------------------------------------------------------------
# geraete:
#   - name: Waschmaschine
#     art: waschmaschine
#     bereich: Waschküche                 # Raum in HA (ID oder Name)
#     leistung: sensor.WASCHMASCHINE_LEISTUNG
#     schwelle: 5                         # läuft, solange mehr als 5 W
#     # mitteilung: input_boolean.waschmaschine_mitteilung

# ---------------------------------------------------------------------------
# Türen, Tore, Kameras. Tore (cover) und Schlösser (lock), die einem Raum zugeordnet sind,
# erscheinen automatisch. Hier nur Zusätzliches eintragen.
# ---------------------------------------------------------------------------
# zugang:
#   - entity: lock.BUERO_EINGANG
#     standort: firma
# kameras:
#   - entity: camera.EINFAHRT
#     standort: firma
# ereignisse:                              # erscheinen unter Sicherheit → Heute
#   - binary_sensor.EINFAHRT_PERSON

